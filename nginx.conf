# RentalFlow - nginx configuration for the LARAVEL application
#
# Rewritten after the legacy PHP app was deleted. The old file rooted every
# location at /var/www/rentaflow/frontend/public and /backend/public, neither
# of which exists any more.
#
# Assumes the repository sits at /var/www/rentaflow, so the document root is one
# level above laravel/.

server {
    listen 80;
    listen [::]:80;
    server_name rentalflow.co.ke www.rentalflow.co.ke;

    # Everything is served over TLS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 http2;
    server_name rentalflow.co.ke www.rentalflow.co.ke;

    root /var/www/rentaflow/laravel/public;
    index index.php;

    ssl_certificate     /etc/ssl/certs/rentalflow.co.ke.crt;
    ssl_certificate_key /etc/ssl/private/rentalflow.co.ke.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    access_log /var/log/nginx/rentalflow_access.log;
    error_log  /var/log/nginx/rentalflow_error.log;

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
    }

    # Source, env files and VCS metadata must never be reachable.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(bak|sql|log|md|ini|sh)$ {
        deny all;
    }

    # Laravel serves everything else; no path may execute a file we did not route.
    location ~ \.php$ {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
}