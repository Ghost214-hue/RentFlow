server {
    listen 80;
    listen [::]:80;
    server_name rentalflow.co.ke www.rentalflow.co.ke;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rentalflow.co.ke www.rentalflow.co.ke;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/rentalflow.co.ke.crt;
    ssl_certificate_key /etc/ssl/private/rentalflow.co.ke.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/rentaflow_access.log;
    error_log /var/log/nginx/rentaflow_error.log;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Disable directory listing
    autoindex off;

    # Static assets - cache aggressively
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        root /var/www/rentaflow/frontend/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend API - PHP handler with correct root
    location ^~ /api/ {
        root /var/www/rentaflow/backend/public;

        location ~ \.php$ {
            root /var/www/rentaflow/backend/public;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param PHP_VALUE "upload_max_filesize=10M";
            fastcgi_param PHP_VALUE "post_max_size=10M";
        }

        # Non-PHP files in /api/
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Frontend pages - PHP handler with correct root
    location / {
        root /var/www/rentaflow/frontend/public;
        index index.php;

        location ~ \.php$ {
            root /var/www/rentaflow/frontend/public;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param PHP_VALUE "upload_max_filesize=10M";
            fastcgi_param PHP_VALUE "post_max_size=10M";
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent access to sensitive files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to .env files
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;
}