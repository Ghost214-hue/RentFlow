# RentFlow Laravel dev server
#
# WHY THIS EXISTS
#
# `php artisan serve` uses PHP's built-in web server, which is SINGLE-THREADED.
# Windows cannot fork workers for it ("forking is not supported on this
# platform"), so PHP_CLI_SERVER_WORKERS has no effect. A browser opens several
# connections per page (HTML, CSS, JS, webfonts); with one thread those queue
# behind each other, and a single slow request pushes the rest past PHP's 30
# second limit -- surfacing as a spurious
# "Maximum execution time of 30 seconds exceeded" 500.
#
# Apache's mpm_winnt is threaded, so concurrent requests are handled in
# parallel. This also matches production more closely than the built-in server.
#
# To use: copy this file to  C:\xampp\apache\conf\extra\httpd-rentflow.conf
#         then ensure httpd.conf includes it:
#             Include conf/extra/httpd-rentflow.conf
#         and restart Apache.
#
# The app is then at http://127.0.0.1:8080

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/RentFlow/laravel/public"

    <Directory "C:/xampp/htdocs/RentFlow/laravel/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Storage and vendor must never be served over HTTP.
    <DirectoryMatch "^C:/xampp/htdocs/RentFlow/laravel/(storage|app|database|tests)">
        Require all denied
    </DirectoryMatch>

    # Laravel front controller: everything that is not a real file.
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Strip the trailing slash from directories.
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Pass real files (assets) straight through.
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Everything else goes to Laravel.
        RewriteRule ^ index.php [L]
    </IfModule>

    # Let Laravel serve built assets; fall back to index.php.
    <IfModule mime_module>
        AddType application/javascript .js
        AddType text/css .css
        AddType font/woff2 .woff2
        AddType image/svg+xml .svg
    </IfModule>

    ErrorLog "logs/rentflow-error.log"
    CustomLog "logs/rentflow-access.log" common
</VirtualHost>